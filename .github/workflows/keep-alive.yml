name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          if [ -z "${{ vars.BACKEND_HEALTH_URL }}" ]; then
            echo "BACKEND_HEALTH_URL repo variable is not set - skipping ping." \
              "Set it under Settings > Secrets and variables > Actions > Variables" \
              "once the Render backend is deployed."
            exit 0
          fi
          curl -sf "${{ vars.BACKEND_HEALTH_URL }}/api/health" \
            || echo "Ping failed - backend may be cold-starting or down."
